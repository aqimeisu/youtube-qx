#!name=YouTube Stable AdBlock
#!desc=稳定版 YouTube 去广告（不影响首页刷新），chatgpt写的
#!author=YourName
#!homepage=https://github.com/YourName
#!version=1.0
#!updated=2026-02-19

############################################
# MITM
############################################

[MITM]
hostname = youtubei.googleapis.com, *.googlevideo.com

############################################
# UDP 拦截（防止广告走 UDP）
############################################

[Rule]
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

############################################
# 视频广告参数拦截（温和型）
############################################

[Rewrite]

# 去除 video 流中的广告标记参数（安全写法）
^https?:\/\/[\w-]+\.googlevideo\.com\/.+&oad url reject-200

############################################
# 去除 youtube 广告统计
############################################

^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads url reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) url reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext url reject-200

############################################
# 核心 API 响应修改（只改 JSON，不拦截请求）
############################################

^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|get_watch) url script-response-body https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js
